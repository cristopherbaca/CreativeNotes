<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyNotes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">M</span><span>mynotes</span></div>
      <div class="workspace-label">YOUR LIBRARY <button class="icon-button" id="newNotebook" title="Create notebook">+</button></div>
      <div id="notebookList" class="notebook-list"></div>
      <div class="sidebar-footer"><span class="status-dot"></span><span>Saved locally</span></div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="breadcrumb"><span id="breadcrumbNotebook">My first notebook</span><span class="slash">/</span><span id="breadcrumbPage">Welcome page</span></div>
        <div class="top-actions"><button class="ghost-button" id="renameNotebook">Rename notebook</button><button class="primary-button" id="exportPdf"><span class="button-icon">↓</span> Export PDF</button></div>
      </header>

      <section class="workspace">
        <div class="page-rail">
          <div class="rail-heading"><div><span class="eyebrow">NOTEBOOK</span><h1 id="notebookTitle">My first notebook</h1></div><button class="icon-button pale" id="addPage" title="Add page">+</button></div>
          <div id="pageList" class="page-list"></div>
          <button class="add-page-button" id="addPageBottom"><span>+</span> New page</button>
        </div>

        <div class="editor-area">
          <div class="editor-toolbar">
            <div class="page-info"><span class="page-badge" id="pageNumber">01</span><div><strong id="pageName">Welcome page</strong><small>Page <span id="pageCount">1</span> of <span id="pageTotal">1</span></small></div></div>
            <div class="tool-group"><button class="tool-button active" data-tool="text" title="Text mode">T</button><button class="tool-button pen-tool" data-tool="pen" title="Pen mode">✎</button><span class="toolbar-divider"></span><button class="tool-button" id="clearInk" title="Clear pen strokes">⌫</button><button class="tool-button" id="renamePage" title="Rename page">⋯</button></div>
          </div>
          <div class="paper-wrap"><div class="paper" id="paper"><textarea id="pageEditor" spellcheck="true" aria-label="Page content"></textarea><canvas id="inkCanvas"></canvas><div class="paper-footer"><span>mynotes</span><span id="paperPage">01</span></div></div></div>
          <div class="editor-hint"><span class="hint-key">⌘</span> Changes save automatically <span class="hint-separator"></span> <span class="hint-key">P</span> Pen mode</div>
        </div>
      </section>
    </main>
  </div>
  <div id="toast" class="toast"></div>
  <script src="renderer.js"></script>
</body>
</html>
